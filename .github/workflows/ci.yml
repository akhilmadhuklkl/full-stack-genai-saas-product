name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db
      AUTH_SECRET: ci-test-secret
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: test-model
      REDIS_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Check Python compilation
        run: python -m compileall -q app tests migrations evals

      - name: Run Ruff
        run: ruff check app tests migrations evals

      - name: Run Bandit security scan
        run: bandit -r app -ll

      - name: Audit Python dependencies
        run: pip-audit

      - name: Check for likely committed secrets
        shell: bash
        run: |
          ! grep -RInE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----)" \
            --exclude-dir=.git --exclude-dir=.venv --exclude="*.pyc" .

      - name: Validate frontend JavaScript
        run: node --check web/app.js

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migration downgrade and upgrade
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
