[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "full-stack-genai-saas-product"
version = "0.1.0"
description = "A full-stack GenAI SaaS code review assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "email-validator>=2.2,<3.0",
    "redis>=5.0,<6.0",
    "rq>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
